<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>欸！幫我抓一下那隻調皮鬼</title>
    <style>
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background-color: #0c111a;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
        }
        .header { text-align: center; margin-top: 5px; width: 100%; max-width: 360px; }
        h1 { color: #9c88ff; margin: 0; font-size: 1.3rem; text-shadow: 0 0 10px rgba(156,136,255,0.6); line-height: 1.3; }
        .timer { font-size: 1.02rem; color: #f5cd79; font-weight: bold; margin-top: 5px; min-height: 24px; }
        
        /* 💖 里程碑特效 */
        .milestone-love { color: #ff7597; text-shadow: 0 0 8px rgba(255,117,151,0.6); }
        .milestone-home { color: #ffb142; text-shadow: 0 0 12px rgba(255,177,66,0.8); font-size: 1.1rem; }
        
        #gameCanvas {
            background-color: #141923;
            border: 3px solid #ff793f;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            margin-top: 5px;
        }

        /* 👑 全新手機專屬：萬聖節發光虛擬按鍵區 */
        .controls-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 15px;
            width: 100%;
            max-width: 240px;
        }
        .control-row {
            display: flex;
            justify-content: center;
            width: 100%;
        }
        .btn-dir {
            width: 54px;
            height: 54px;
            margin: 5px;
            background: #1e272e;
            border: 2px solid #9c88ff;
            border-radius: 15px;
            color: #ff793f;
            font-size: 1.6rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            cursor: pointer;
            transition: background 0.1s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
        }
        /* 點擊時的發光反饋特效 */
        .btn-dir:active {
            background: #ff793f;
            color: #fff;
            border-color: #ff793f;
            transform: scale(0.92);
            box-shadow: 0 0 15px rgba(255,121,63,0.6);
        }
        /* 讓左右按鈕中間有好看的空隙 */
        .space-holder { width: 54px; height: 54px; margin: 5px; }

        #ghost-heart {
            display: none;
            font-size: 4rem;
            position: absolute;
            left: 50%;
            top: 14%;
            transform: translate(-50%, -50%) scale(1.3);
            z-index: 999;
        }
        .result-box {
            display: none;
            position: fixed;
            top: 62%; 
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e272e;
            border: 3px solid #9c88ff;
            padding: 25px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.9);
            z-index: 1000;
            width: 88%;
            max-width: 400px;
            max-height: 52vh; 
            box-sizing: border-box;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; 
        }
        .confession-text { line-height: 1.65; color: #d2dae2; font-weight: bold; font-size: 1.02rem; text-align: center; margin: 0; }
        .close-card-btn {
            background-color: #ff793f; color: white; border: none; padding: 10px 30px;
            font-size: 1rem; font-weight: bold; border-radius: 50px; cursor: pointer;
            margin-top: 20px; box-shadow: 0 4px 10px rgba(255,121,63,0.3); width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1 id="game-title">🐍 欸！這隻幽靈蛇太貪吃，能幫我抓住那隻調皮鬼嗎？ 🎃</h1>
        <div class="timer" id="timer-box">倒數計時：<span id="time-left">40</span> 秒 | 目前得分：<span id="score-val">0</span></div>
    </div>

    <div id="ghost-heart">🥰❤️</div>
    <!-- 縮小一點點畫布，留空間給手機按鈕，完美適配所有螢幕 -->
    <canvas id="gameCanvas" width="320" height="320"></canvas>

    <!-- 👑 手機實體按鈕區面世 -->
    <div class="controls-container">
        <div class="control-row">
            <div class="btn-dir" id="btn-up">▲</div>
        </div>
        <div class="control-row">
            <div class="btn-dir" id="btn-left">◀</div>
            <div class="space-holder"></div>
            <div class="btn-dir" id="btn-right">▶</div>
        </div>
        <div class="control-row">
            <div class="btn-dir" id="btn-down">▼</div>
        </div>
    </div>

    <!-- 告白告示牌 -->
    <div id="result-window" class="result-box">
        <h2 style="color: #f5cd79; margin: 0 0 18px 0; text-align: center; font-size: 1.4rem;">🎃 一年一度的萬聖節！ 👻</h2>
        <div class="confession-text">
            聽說有隻調皮的幽靈，<br>
            跑得太快，怎麼都抓不到！<br><br>
            不過沒關係啦～<br>
            還有巧克力🍫和小玩具可以玩！🎁<br><br>
            最近為了日文考試，<br>
            辛苦啦～！<br><br>
            不論好壞~<br>
            在努力的日子裡，<br>
            別忘了留一點時間給自己。<br><br>
            偶爾放下課本，<br>
            吃點喜歡的東西、開心笑一笑，<br>
            也算是有替生活補充一點魔法吧！✨<br><br>
            至於在學校不一定會主動靠近，<br>
            不是刻意疏遠妳喔！<br><br>
            我一直都有放在心上，<br>
            一直想著喔！❤️<br><br>
            希望這份小小的萬聖小禮包，<br>
            能讓妳多一點安心和笑容。🎃✨
            
            <button class="close-card-btn" onclick="startSecondRound()">收下心意 🍬 (進入第二回：無限刷分挑戰)</button>
        </div>
    </div>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let timeLeft = 40;
        let score = 0;
        let gameStage = 1; 

        const gridSize = 20; 
        const tileCount = 16; // 16 * 20 = 320 完美吻合

        let snake = [{x: 8, y: 8}];
        let dx = 1;
        let dy = 0;

        let food = {x: 4, y: 4, icon: "🍬"};
        const candyIcons = ["🍬", "🍭", "🎃", "🍫"];

        // 👑 綁定手機螢幕虛擬按鍵的觸控事件（防爆、零延遲）
        document.getElementById("btn-up").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(0, -1); });
        document.getElementById("btn-down").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(0, 1); });
        document.getElementById("btn-left").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(-1, 0); });
        document.getElementById("btn-right").addEventListener("touchstart", (e) => { e.preventDefault(); changeDirection(1, 0); });

        // 同步支援滑鼠點擊（方便你在電腦上用滑鼠測試）
        document.getElementById("btn-up").addEventListener("mousedown", () => changeDirection(0, -1));
        document.getElementById("btn-down").addEventListener("mousedown", () => changeDirection(0, 1));
        document.getElementById("btn-left").addEventListener("mousedown", () => changeDirection(-1, 0));
        document.getElementById("btn-right").addEventListener("mousedown", () => changeDirection(1, 0));

        // 電腦實體鍵盤事件保持相容
        window.addEventListener("keydown", (e) => {
            if (gameStage === 2) return;
            if (e.key === "ArrowUp") changeDirection(0, -1);
            if (e.key === "ArrowDown") changeDirection(0, 1);
            if (e.key === "ArrowLeft") changeDirection(-1, 0);
            if (e.key === "ArrowRight") changeDirection(1, 0);
        });

        // 核心轉彎安全防線：禁止蛇原地回頭自殺
        function changeDirection(newDx, newDy) {
            if (gameStage === 2) return;
            if (newDx !== 0 && dx === 0) { dx = newDx; dy = 0; }
            if (newDy !== 0 && dy === 0) { dx = 0; dy = newDy; }
        }

        function spawnFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
            food.icon = candyIcons[Math.floor(Math.random() * candyIcons.length)];
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) { spawnFood(); }
            });
        }

        const timerInterval = setInterval(() => {
            if (gameStage !== 1) return;
            timeLeft--;
            document.getElementById('time-left').innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                endFirstRound();
            }
        }, 1000);

        function endFirstRound() {
            gameStage = 2;
            document.getElementById('ghost-heart').style.display = 'block';
            document.getElementById('result-window').style.display = 'block';
        }

        function startSecondRound() {
            document.getElementById('result-window').style.display = 'none';
            document.getElementById('ghost-heart').style.display = 'none';
            
            document.getElementById('game-title').innerText = "💥 進階挑戰~ 這回撞牆或咬到身體直接重扣 15 分！ 💥";
            
            updateScoreDisplay();
            gameStage = 3;
            resetSnake();
        }

        function resetSnake() {
            snake = [{x: 8, y: 8}];
            dx = 1;
            dy = 0;
            spawnFood();
        }

        function updateScoreDisplay() {
            if (gameStage === 1) {
                document.getElementById('timer-box').innerHTML = "倒數計時：<span id='time-left'>" + timeLeft + "</span> 秒 | 目前得分：<span id='score-val'>" + score + "</span>";
                return;
            }
            
            let baseText = "🔥 挑戰模式 🔥 | 目前得分：<span id='score-val'>" + score + "</span>";
            let milestoneText = "";

            if (score >= 25 && score < 35) {
                milestoneText = " | <span class='milestone-love'>✨ 最愛妳了 🥰</span>";
            } else if (score >= 35) {
                milestoneText = " | <span class='milestone-home'>🏡❤️ 把妳帶回家！</span>";
            }

            document.getElementById('timer-box').innerHTML = baseText + milestoneText;
            document.getElementById('timer-box').style.color = (score >= 35) ? "#f5cd79" : "#ff793f";
        }

        function update() {
            if (gameStage === 2) return;

            let head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (gameStage === 1) {
                if (head.x < 0) head.x = tileCount - 1;
                if (head.x >= tileCount) head.x = 0;
                if (head.y < 0) head.y = tileCount - 1;
                if (head.y >= tileCount) head.y = 0;
            } 
            else if (gameStage === 3) {
                let hitWall = head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount;
                let hitSelf = false;
                for (let i = 1; i < snake.length; i++) {
                    if (snake[i].x === head.x && snake[i].y === head.y) hitSelf = true;
                }

                if (hitWall || hitSelf) {
                    score = Math.max(0, score - 15); 
                    updateScoreDisplay();
                    resetSnake();
                    return;
                }
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score++;
                updateScoreDisplay();
                spawnFood();
            } else {
                snake.pop();
            }

            if (gameStage === 1) {
                for (let i = 1; i < snake.length; i++) {
                    if (head.x === snake[i].x && head.y === snake[i].y) {
                        snake = [head]; 
                        break;
                    }
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (gameStage === 2) return;

            // 畫萬聖節糖果
            ctx.font = "16px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(food.icon, food.x * gridSize + gridSize / 2, food.y * gridSize + gridSize / 2);

            // 畫萬聖節彩色蛇身
            snake.forEach((part, index) => {
                ctx.fillStyle = (index === 0) ? "#ff793f" : (index % 2 === 0 ? "#9c88ff" : "#786fa6");
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
            });
        }

        function main() {
            setTimeout(function onTick() {
                update();
                draw();
                main();
            }, 140);
        }

        spawnFood();
        main();
    </script>
</body>
</html>
